<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football Leaderboard</title>

<style>
body{
    font-family: Arial;
    background:#141E30;
    color:white;
    text-align:center;
}

table{
    width:95%;
    margin:auto;
    background:white;
    color:black;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
}

button{
    padding:5px;
    margin:2px;
    cursor:pointer;
}

#adminPanel{display:none;margin:10px;}
#history{margin-top:20px;}
</style>
</head>

<body>

<h1>AFC League Official Football Leaderboard</h1>

<p id="status">Viewer mode</p>

<input id="pass" type="password" placeholder="Admin password">
<button onclick="login()">Login</button>

<br><br>

<div id="adminPanel">
    <input id="name" placeholder="Player name">
    <button onclick="addPlayer()">Add Player</button>
    <button onclick="undo()">Undo</button>
</div>

<br>

<table>
<thead>
<tr>
<th>Name</th>
<th>Goals</th>
<th>Assists</th>
<th>Wins</th>
<th>Draws</th>
<th>Losses</th>
<th>Total</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

<h3>History</h3>
<div id="history"></div>

<script>
const ADMIN_PASS = "Theod34567";

let isAdmin = false;

let players = JSON.parse(localStorage.getItem("players") || "[]");
let history = JSON.parse(localStorage.getItem("history") || "[]");
let backup = null;

/* SAVE */
function save(){
    localStorage.setItem("players", JSON.stringify(players));
    localStorage.setItem("history", JSON.stringify(history));
}

/* LOGIN */
function login(){
    const pass = document.getElementById("pass").value;

    if(pass === ADMIN_PASS){
        isAdmin = true;
        document.getElementById("status").innerText = "ADMIN MODE";
        document.getElementById("adminPanel").style.display = "block";
    } else {
        alert("Wrong password");
    }
    render();
}

/* ADD PLAYER */
function addPlayer(){
    if(!isAdmin) return;

    const name = document.getElementById("name").value;
    if(!name) return;

    players.push({
        name,
        goals:0,
        assists:0,
        wins:0,
        draws:0,
        losses:0
    });

    history.push("Added " + name);
    save();
    render();
}

/* CHANGE STATS */
function change(i,field,val){
    if(!isAdmin) return;

    backup = JSON.parse(JSON.stringify(players));

    players[i][field] += val;
    if(players[i][field] < 0) players[i][field] = 0;

    history.push(players[i].name + " " + field + " " + val);

    save();
    render();
}

/* UNDO */
function undo(){
    if(!isAdmin || !backup) return;

    players = backup;
    history.push("UNDO");
    save();
    render();
}

/* TOTAL */
function total(p){
    return p.goals*1.5 + p.assists + p.wins*3 - p.losses;
}

/* RENDER */
function render(){
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    players.forEach((p,i)=>{
        tbody.innerHTML += `
        <tr>
            <td>${p.name}</td>

            <td>${p.goals}
            <button onclick="change(${i},'goals',1)">+</button></td>

            <td>${p.assists}
            <button onclick="change(${i},'assists',1)">+</button></td>

            <td>${p.wins}
            <button onclick="change(${i},'wins',1)">+</button></td>

            <td>${p.draws}
            <button onclick="change(${i},'draws',1)">+</button></td>

            <td>${p.losses}
            <button onclick="change(${i},'losses',1)">+</button></td>

            <td>${total(p).toFixed(1)}</td>
        </tr>
        `;
    });

    document.getElementById("history").innerHTML =
        history.slice(-10).reverse().map(h => `<div>${h}</div>`).join("");
}

render();
</script>

</body>
</html>
