<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football League Online</title>

<style>
body{
    font-family: Arial;
    background: #141E30;
    color: white;
    text-align: center;
}

table{
    width: 95%;
    margin: auto;
    background: white;
    color: black;
    border-collapse: collapse;
}

th, td{
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}

button{
    margin: 2px;
    padding: 5px;
}

#adminPanel{
    margin: 10px;
}
</style>
</head>

<body>

<h1>⚽ Football Online Leaderboard</h1>

<p id="status">Not logged in</p>

<input id="email" placeholder="admin email">
<input id="password" type="password" placeholder="password">
<button onclick="login()">Login</button>

<br><br>

<div id="adminPanel" style="display:none;">
    <input id="name" placeholder="Player name">
    <button onclick="addPlayer()">Add Player</button>
    <button onclick="undo()">↩ Undo Last Change</button>
</div>

<br>

<table>
<thead>
<tr>
<th>Player</th>
<th>Goals</th>
<th>Assists</th>
<th>Wins</th>
<th>Draws</th>
<th>Losses</th>
<th>Total</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<h2>History</h2>
<div id="history"></div>

<script type="module">
    let isAdmin = false;

/* 🔐 ADMIN LOGIN */
function login(){
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    if(email === "peixeiknight@gmail.com" && pass === "Theod3456"){
        isAdmin = true;
        document.getElementById("status").innerText = "ADMIN MODE ON";
        alert("Logged in successfully");
    } else {
        alert("Wrong login");
    }
}

/* BLOCK EDITING FOR NON-ADMINS */
function requireAdmin(){
    if(!isAdmin){
        alert("Admin only");
        return false;
    }
    return true;
}


</script>

</body>
</html>
