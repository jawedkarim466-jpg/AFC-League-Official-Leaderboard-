<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{font-family:Arial;background:#111;color:white;text-align:center;}
table{margin:auto;width:90%;background:white;color:black;}
td,th{padding:8px;border:1px solid #ddd;}
button{margin:2px;}
#admin{display:none;margin:10px;}
</style>
</head>

<body>

<h1>Football Leaderboard</h1>

<input id="pass" type="password" placeholder="Admin password">
<button onclick="login()">Login</button>

<p id="status">Viewer mode</p>

<div id="admin">
<input id="name" placeholder="Player name">
<button onclick="add()">Add Player</button>
<button onclick="undo()">Undo</button>
</div>

<br>

<table>
<thead>
<tr>
<th>Name</th>
<th>Goals</th>
<th>Assists</th>
<th>Wins</th>
<th>Draws</th>
<th>Losses</th>
<th>Total</th>
</tr>
</thead>
<tbody id="t"></tbody>
</table>

<h3>History</h3>
<div id="h"></div>

<script>
const ADMIN_PASS="1234";
let admin=false;

let players=JSON.parse(localStorage.getItem("p")||"[]");
let history=JSON.parse(localStorage.getItem("h")||"[]");
let backup=null;

function save(){
localStorage.setItem("p",JSON.stringify(players));
localStorage.setItem("h",JSON.stringify(history));
}

function login(){
if(document.getElementById("pass").value===ADMIN_PASS){
admin=true;
document.getElementById("status").innerText="ADMIN MODE";
document.getElementById("admin").style.display="block";
}
render();
}

function add(){
if(!admin)return;

let n=document.getElementById("name").value;
if(!n)return;

players.push({name:n,g:0,a:0,w:0,d:0,l:0});
history.push("Added "+n);
save();render();
}

function change(i,k,v){
if(!admin)return;

backup=JSON.parse(JSON.stringify(players));

players[i][k]+=v;
if(players[i][k]<0)players[i][k]=0;

history.push(players[i].name+" "+k+" "+v);
save();render();
}

function undo(){
if(!admin||!backup)return;

players=backup;
history.push("UNDO");
save();render();
}

function total(p){
return p.g*1.5+p.a+p.w*3-p.l;
}

function render(){
let t=document.getElementById("t");
t.innerHTML="";

players.forEach((p,i)=>{
t.innerHTML+=`
<tr>
<td>${p.name}</td>
<td>${p.g}<button onclick="change(${i},'g',1)">+</button></td>
<td>${p.a}<button onclick="change(${i},'a',1)">+</button></td>
<td>${p.w}<button onclick="change(${i},'w',1)">+</button></td>
<td>${p.d}</td>
<td>${p.l}<button onclick="change(${i},'l',1)">+</button></td>
<td>${total(p).toFixed(1)}</td>
</tr>`;
});

document.getElementById("h").innerHTML=
history.slice(-10).reverse().map(x=>"<div>"+x+"</div>").join("");
}

render();
</script>

</body>
</html>
